[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-symbolics"
version = "0.2.0"
description = "Constitutional fixed-point symbolic computation framework; the core uses only the Python standard library."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = []

[project.optional-dependencies]
engines = ["numpy>=1.24"]
# For running corpus/ (not installed as a package; run its scripts from the corpus/ folder).
# PyTorch is optional too: corpus/engines/reconstructed_frameworks_comparison.py uses it when present.
corpus = ["numpy>=1.24", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["symbolics*", "engines*", "examples*", "athanor*", "reference_agent*"]
