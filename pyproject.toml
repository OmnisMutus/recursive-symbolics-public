[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-symbolics"
version = "0.2.0"
description = "Constitutional fixed-point symbolic computation framework with zero-dependency core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = []

[project.optional-dependencies]
engines = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["symbolics*", "engines*", "examples*"]
