name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Quickstart Reference Demos
      run: |
        python examples/quickstart.py

    - name: Run Conformance Suite (Articles 5.1(D), 6, 8, 9)
      run: |
        python -m symbolics.conformance

    - name: Run Architecture Index & Intent Drift Checker
      run: |
        python -m symbolics.layers

    - name: Run Outgoing Commit Leak Scanner
      run: |
        python -m symbolics.outgoing

    - name: Run Full Unit & Mutation Test Suite
      run: |
        python -m unittest discover -s tests -v
